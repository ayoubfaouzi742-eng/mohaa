<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الأحذية النسائية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background-color: #e91e63;
            color: white;
            text-align: center;
            padding: 20px;
        }
        nav {
            background-color: #c2185b;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        .product-card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin: 15px;
            width: 250px;
            text-align: center;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
        }
        .price {
            color: #e91e63;
            font-size: 1.2em;
            font-weight: bold;
            margin: 10px 0;
        }
        .btn {
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #c2185b;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>أناقة - متجر الأحذية النسائية</h1>
        <p>أحدث صيحات الموضة والأناقة بين يديك</p>
    </header>

    <nav>
        <a href="#">الرئيسية</a>
        <a href="#">أحذية كعب عالي</a>
        <a href="#">أحذية رياضية</a>
        <a href="#">تواصل معنا</a>
    </nav>

    <div class="container">
        <!-- المنتج الأول -->
        <div class="product-card">
            <img src="yassin5.png" alt="حذاء كعب عالي">
            <h3>حذاء كعب عالي أنيق</h3>
            <p class="price">250 درهم</p>
            <button class="btn">اشتري الآن</button>
        </div>

        <!-- المنتج الثاني -->
        <div class="product-card">
            <img src="https://via.placeholder.com/200" alt="حذاء رياضي">
            <h3>حذاء رياضي مريح</h3>
            <p class="price">200 درهم</p>
            <button class="btn">اشتري الآن</button>
        </div>

        <!-- المنتج الثالث -->
        <div class="product-card">
            <img src="https://via.placeholder.com/200" alt="حذاء صيفي">
            <h3>صندل صيفي أنيق</h3>
            <p class="price">180 درهم</p>
            <button class="btn">اشتري الآن</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 متجر أناقة. جميع الحقوق محفوظة.</p>
    </footer>

</body>
  </html>
